# Optional: Postgres for chat history if you don't have one locally.
#   docker compose up -d
#   DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/product_agent
services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
